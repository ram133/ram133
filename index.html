<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ram133</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
      text-align: center;
    }

    h1 {
      color: var(--heading);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p {
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      color: var(--accent);
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background-color: #21262d;
      border-color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ram133</h1>
    <p>Welcome to the GitHub Pages site for ram133/.github</p>
    <div class="links">
      <a class="btn" href="https://github.com/ram133">GitHub Profile</a>
      <a class="btn" href="https://github.com/ram133/.github">Repository Source</a>
    </div>
  </div>

</body>
</html>
