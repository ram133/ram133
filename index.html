<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clifford Ray Hackett - Repository Directory</title>
<style>
:root {
--bg-color: #0d1117;
--card-bg: #161b22;
--border-color: #30363d;
--text-primary: #f0f6fc;
--text-secondary: #8b949e;
--accent-color: #58a6ff;
--accent-hover: #1f6feb;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: var(--bg-color);
color: var(--text-primary);
margin: 0;
padding: 2rem 1rem;
}
.container {
max-width: 1000px;
margin: 0 auto;
}
header {
text-align: center;
margin-bottom: 2rem;
}
h1 {
font-size: 2.2rem;
margin-bottom: 0.5rem;
}
p.subtitle {
color: var(--text-secondary);
font-size: 1.1rem;
}
.search-box {
width: 100%;
padding: 0.75rem 1rem;
font-size: 1rem;
background-color: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 6px;
color: var(--text-primary);
margin-bottom: 2rem;
box-sizing: border-box;
}
.search-box:focus {
outline: none;
border-color: var(--accent-color);
box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
}
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
gap: 1rem;
}
.card {
background-color: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 6px;
padding: 1.25rem;
display: flex;
flex-direction: column;
justify-content: space-between;
transition: border-color 0.2s;
}
.card:hover {
border-color: var(--accent-color);
}
.card-title {
font-size: 1.1rem;
font-weight: 600;
margin: 0 0 0.5rem 0;
word-break: break-all;
}
.card-title a {
color: var(--accent-color);
text-decoration: none;
}
.card-title a:hover {
text-decoration: underline;
}
.card-desc {
color: var(--text-secondary);
font-size: 0.9rem;
margin: 0 0 1rem 0;
flex-grow: 1;
}
.card-footer {
display: flex;
gap: 0.75rem;
font-size: 0.85rem;
}
.btn {
background-color: var(--border-color);
color: var(--text-primary);
padding: 0.35rem 0.75rem;
border-radius: 4px;
text-decoration: none;
text-align: center;
font-weight: 500;
}
.btn:hover {
background-color: var(--accent-hover);
}
.btn-primary {
background-color: #238636;
}
.btn-primary:hover {
background-color: #2ea043;
}
.loading, .error {
text-align: center;
color: var(--text-secondary);
grid-column: 1 / -1;
padding: 2rem;
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Repository Directory</h1>
<p class="subtitle">Public repositories for ram133</p>
</header>

<input type="text" id="searchInput" class="search-box" placeholder="Filter repositories..." onkeyup="filterRepos()">

<div id="repoGrid" class="grid">
<div class="loading">Loading repositories from GitHub...</div>
</div>
</div>

<script>
let allRepos = [];

async function fetchRepos() {
try {
const response = await fetch('https://api.github.com/users/ram133/repos?per_page=100&sort=updated');
if (!response.ok) throw new Error('Failed to fetch repositories');
allRepos = await response.json();
displayRepos(allRepos);
} catch (error) {
document.getElementById('repoGrid').innerHTML = `<div class="error">Could not load repositories at this time.</div>`;
}
}

function displayRepos(repos) {
const grid = document.getElementById('repoGrid');
if (repos.length === 0) {
grid.innerHTML = `<div class="error">No repositories found.</div>`;
return;
}

grid.innerHTML = repos.map(repo => {
const desc = repo.description ? repo.description : 'No description provided.';
const demoUrl = `https://ram133.github.io/${repo.name}/`;
return `
<div class="card">
<div>
<h2 class="card-title"><a href="${repo.html_url}" target="_blank">${repo.name}</a></h2>
<p class="card-desc">${desc}</p>
</div>
<div class="card-footer">
<a href="${repo.html_url}" class="btn" target="_blank">GitHub</a>
<a href="${demoUrl}" class="btn btn-primary" target="_blank">Live Demo</a>
</div>
</div>
`;
}).join('');
}

function filterRepos() {
const query = document.getElementById('searchInput').value.toLowerCase();
const filtered = allRepos.filter(repo =>
repo.name.toLowerCase().includes(query) ||
(repo.description && repo.description.toLowerCase().includes(query))
);
displayRepos(filtered);
}

fetchRepos();
</script>
</body>
</html>
